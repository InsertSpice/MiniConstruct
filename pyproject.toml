[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "miniconstruct"
version = "0.1.0"
description = "A local MiniMax H3 structured-prompt workbench"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
miniconstruct = "miniconstruct.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["miniconstruct"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "miniconstruct/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
